<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Pavan Rothe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="nav-container">
                <a class="brand" href="index.html">Pavan Rothe</a>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="section page-hero contact-page">
            <div class="section-header">
                <p class="eyebrow">Contact</p>
                <h1>Get In Touch</h1>
               
            </div>

            <div class="contact-grid">
                <article class="card contact-card">
                    <h2>Contact Details</h2>
                    <p class="contact-summary">Reach me through the details below.</p>

                    <div class="contact-lines">
                        <p><strong>Phone:</strong> contact-9637719689</p>
                        <p><strong>Email:</strong> pavan.r.rothe@gmail.com</p>
                    </div>
                </article>

                <form class="card contact-form" action="#" method="post">
                    <h2>Send a Message</h2>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Write your message here"></textarea>
                    </div>

                    <button type="submit" class="button">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>© 2026 Pavan Rothe</p>
            <p>Phone and email available for assignments and simple enquiries</p>
        </div>
    </footer>
</body>
</html>
